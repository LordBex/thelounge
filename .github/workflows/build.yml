name: Build

permissions:
  contents: read

on: [push, pull_request]

jobs:
  build:
    name: Node on ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - macOS-latest
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@master

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn --immutable

      - name: Rebuild native modules
        run: yarn rebuild better-sqlite3

      - name: Build
        run: yarn build
        env:
          NODE_ENV: production

      - name: Test
        run: yarn test
